name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '♻️ Refactoring'
    labels:
      - 'refactor'
  - title: '🧹 Chores'
    labels:
      - 'chore'
  - title: '🔧 Other Changes'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement', 'feat']
  patch:
    labels: ['patch', 'fix', 'bugfix', 'bug', 'chore', 'documentation', 'refactor']
  default: patch

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**/*'
  - label: 'bug'
    title:
      - '/^fix/i'
      - '/^bug/i'
  - label: 'feature'
    title:
      - '/^feat/i'
      - '/^feature/i'
  - label: 'enhancement'
    title:
      - '/^enhancement/i'
      - '/^enhance/i'
  - label: 'chore'
    title:
      - '/^chore/i'
  - label: 'refactor'
    title:
      - '/^refactor/i'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
