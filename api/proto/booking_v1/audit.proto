syntax = "proto3";

package booking_v1.audit;

import "common/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "booking_v1/booking.proto";

option go_package = "/booking_v1";

service Audit {
  rpc List(AuditListReq) returns (AuditListRep) {
    option (google.api.http) = {
      get: "/audit"
    };
  };

  rpc Get(AuditGetReq) returns (AuditMain) {
    option (google.api.http) = {
      get: "/audit/{id}"
    };
  };
}

message AuditMain {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  AccountMain user = 4;
  string resource = 5;
  string object_id = 6;
  string change_type = 7;

  oneof object {
    google.protobuf.Struct raw = 8;
    booking_v1.booking.BookingMain booking = 9;
  }
}

message AccountMain {
  string id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AuditListReq {
  common.ListParamsSt list_params = 1;

  repeated string ids = 2;
  optional string resource = 3;
  optional string object_id = 4;
  optional string change_type = 5;
  optional string user_id = 6;
}

message AuditListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated AuditMain results = 2;
}

message AuditGetReq {
  string id = 1;
}
